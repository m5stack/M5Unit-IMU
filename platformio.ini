; H2 is otherwise represented by test_MPU6886_NanoH2 alone, which never touches UnitBMI270 -- and
; BMI270 is the only chip whose driver runs a low-level register path of its own (the dummy read and
; the post-reset polls). Same Ex_I2C route as NanoC6, different SoC.
[env:test_BMI270_NanoH2]
extends=NanoH2, option_release, pioarduino_latest
lib_deps = ${NanoH2.lib_deps}
  ${test_fw.lib_deps}
test_filter= embedded/test_bmi270

[env:test_BMI270_NessoN1]
