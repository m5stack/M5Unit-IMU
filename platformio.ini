; ============================================================================
; Built-in IMU hosts NOT yet covered by a test_BUILTIN_* env (add when the
; hardware is on hand; each needs its own [board] section unless noted):
;   MPU6886 (0x68):
;     - StickC (plain, ESP32)  board_M5StickC  (2019 lot SH200Q: test_BUILTIN_SH200Q_StickC)
;     - StickT2                board_M5StickCPlus family
;   BMI270 (0x68):
;     - PaperS3                board_M5PaperS3       (board: m5stack-papers3)
;     - Nesso N1 (ESP32-C6)    board_ArduinoNessoN1  (identity: no C6 axis fix)
; Note: BMM150 on CoreS3 / CoreS3-Lite is reached through the BMI270 AUX
;       interface, already exercised by test_bmi270's AuxMagWhenPresent, so it
;       needs no standalone BMM150 built-in env. AhrsDemo's begin_builtin() now
;       probes the internal bus (m5::unit::imu::detectBuiltinImu) to pick the
;       accel/gyro driver, so it transparently handles the MPU6886<->BMI270
;       generation swaps that M5.getBoard() cannot see (Core2 v1.1/v1.3, ATOM
;       Matrix / v1.1). The axis-remap preset is still chosen by board. Chips
;       with no driver yet (MPU9250, SH200Q) are detected and reported, not run.
; ============================================================================

