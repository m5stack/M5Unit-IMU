;-----------------------------------------------------------------------
; M5Unit-IMU
; For UnitTest and examples (Using M5UnitUnified)
;-----------------------------------------------------------------------
[platformio]

[env]
build_flags =-Wall -Wextra -Wreturn-local-addr -Werror=format -Werror=return-local-addr
lib_ldf_mode = deep
test_framework = googletest
test_build_src = true
lib_deps=m5stack/M5Unified
  m5stack/M5UnitUnified@>=0.6.0
  m5stack/M5Unit-ENV@>=1.7.1  ; For BMP280 / SPA06 (Pa-scaled pressure landed in 1.7.1)

[m5base]
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 1500000
test_speed = 115200

[Core]
extends = m5base
board = m5stack-core-esp32-16M
lib_deps = ${env.lib_deps}

; M5Stack Gray: Core-family board with a built-in MPU6886 (0x68) + BMM150 (0x10) IMU.
[Gray]
extends = m5base
board = m5stack-grey
lib_deps = ${env.lib_deps}

[Core2]
extends = m5base
board = m5stack-core2
lib_deps = ${env.lib_deps}

[CoreS3]
extends = m5base
board = m5stack-cores3
lib_deps = ${env.lib_deps}

[Fire]
extends = m5base
board = m5stack-fire
lib_deps = ${env.lib_deps}

[StampS3]
;include M5Capsule, DinMeter
extends = m5base
board = m5stack-stamps3
lib_deps = ${env.lib_deps}

[Dial]
extends = m5base
board = m5stack-stamps3
lib_deps = ${env.lib_deps}
  m5stack/M5Dial

; The default 1.25 MB app partition is too small on the 4 MB flash for the test envs (each also
; carries the ~485 KB test/ root suite for on-target coverage) and for the AhrsDemo (WiFi viewer +
; 6 filters + IMU drivers), so use huge_app.csv (single 3 MB app, no OTA).
[Atom]
;include AtomMatrix,AtomLite,AtomU
extends = m5base
board = m5stack-atom
lib_deps = ${env.lib_deps}
board_build.partitions = huge_app.csv

[AtomS3]
;include AtomEchoS3R,AtomS3Lite,AtomS3U
extends = m5base
board = m5stack-atoms3
lib_deps = ${env.lib_deps}

; Using ./boards/m5stack-atoms3r.json
[AtomS3R]
;include AtomEchoS3R
extends = m5base
board = m5stack-atoms3r
lib_deps = ${env.lib_deps}

; Using ./boards/m5stack-nanoc6.json
; The default 1.25 MB app partition is too small for the larger examples (AhrsDemo: WiFi viewer +
; 6 filters + DoF drivers), so use huge_app.csv (single 3 MB app, no OTA) on the 4 MB flash.
[NanoC6]
extends = m5base
board = m5stack-nanoc6
lib_deps = ${env.lib_deps}
board_build.partitions = huge_app.csv

; Using ./boards/m5stack-nanoh2.json
; Same as NanoC6: huge_app.csv for the larger examples.
[NanoH2]
extends = m5base
board = m5stack-nanoh2
lib_deps = ${env.lib_deps}
board_build.partitions = huge_app.csv

; Original M5StickC (same PIO board id as the Plus; the earliest 2019 lot carries an SH200Q)
[StickC]
extends = m5base
board = m5stick-c
lib_deps = ${env.lib_deps}

[StickCPlus]
extends = m5base
board = m5stick-c
lib_deps = ${env.lib_deps}

; Using ./boards/m5stick-cplus2.json
[StickCPlus2]
extends = m5base
board = m5stick-cplus2
lib_deps = ${env.lib_deps}

[StickS3]
extends = m5base
board = esp32-s3-devkitc-1
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps = ${env.lib_deps}

[Paper]
extends = m5base
board = m5stack-fire
lib_deps = ${env.lib_deps}

; Per the official docs PlatformIO section (https://docs.m5stack.com/en/core/PaperS3)
[PaperS3]
extends = m5base
board = esp32-s3-devkitm-1
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps = ${env.lib_deps}

[CoreInk]
extends = m5base
board = m5stack-coreink
lib_deps = ${env.lib_deps}

[Cardputer]
extends = m5base
board = esp32-s3-devkitc-1
build_flags =
  -DESP32S3
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps = ${env.lib_deps}

[Station]
extends = m5base
board = m5stack-station
lib_deps = ${env.lib_deps}

[Tab5]
extends = m5base
board = esp32-p4-evboard
board_build.mcu = esp32p4
board_build.flash_mode = qio
; The default 1.25 MB app partition overflows once M5Unit-ENV (+ BME68x) is in the dep graph;
; use huge_app.csv (single 3 MB app, no OTA) -- Tab5 has ample flash and tests do not need OTA.
board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps = ${env.lib_deps}

[NessoN1]
extends = m5base
board = arduino_nesso_n1
; The default 1.25 MB app partition overflows: every test env also carries the test/ root suites, so
; that they run on the target architecture and not just on the host, and that alone is ~485 KB.
; Same fix as NanoC6 / NanoH2 / Tab5 -- huge_app.csv (single 3 MB app, no OTA) on the 16 MB flash.
board_build.partitions = huge_app.csv
lib_deps = ${env.lib_deps}

; --------------------------------
;Choose framework
[arduino_latest]
platform = espressif32 @ 6.12.0
framework = arduino

[pioarduino_latest]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino

; --------------------------------
;Choose build options
[option_release]
build_type=release
build_flags = ${env.build_flags}
  -DCORE_DEBUG_LEVEL=3
  -DLOG_LOCAL_LEVEL=3
  -DAPP_LOG_LEVEL=3
  -DM5_LOG_LEVEL=3

[option_log]
build_type=release
build_flags = ${env.build_flags}
  -DCORE_DEBUG_LEVEL=5
  -DLOG_LOCAL_LEVEL=5
  -DAPP_LOG_LEVEL=5

[option_debug]
build_type=debug
build_flags = ${env.build_flags}
  -DCORE_DEBUG_LEVEL=5
  -DLOG_LOCAL_LEVEL=5
  -DAPP_LOG_LEVEL=5
  -DDEBUG

[option_map]
build_type=release
build_flags = ${env.build_flags}
  -DCORE_DEBUG_LEVEL=3
  -DLOG_LOCAL_LEVEL=3
  -DAPP_LOG_LEVEL=3
  -DM5_LOG_LEVEL=0
  -Wl,-Map,output.map

; Require at least C++14 after 1.13.0
[test_fw]
lib_deps = google/googletest@1.12.1


[env:-----------------------------------------------separator0]

; ================================
; UnitIMU (MPU6886, Unit)
; ================================
; --------------------------------
; UnitTest
; --------------------------------
[env:test_native]
platform = native
test_framework = googletest
test_filter = native/*
test_ignore = embedded/*
; Only the framework-independent math/filter/ahrs_controller sources are native-buildable
; (src/unit/* pulls in M5UnitUnified/Arduino headers not available here). M5Utility is
; itself framework-independent (platforms=* in its library.json) and is pulled in for
; ahrs_controller.cpp's real-clock update() (m5::utility::micros()).
; imu/presets.cpp is excluded: it takes UnitMPU6886/UnitBMI270/UnitBMM150 references, which
; drag in M5UnitUnified/Arduino headers the same way src/unit/* does -- see presets.hpp.
test_build_src = yes
build_src_filter = -<*> +<imu/*.cpp> +<imu/filter/*.cpp> +<imu/filter/third_party/fusion/*.c> +<imu/filter/third_party/vqf/*.cpp> +<math/*.cpp> -<imu/presets.cpp>
build_flags = ${env.build_flags}
  -std=gnu++11
  -Isrc
lib_deps = google/googletest@1.12.1
  m5stack/M5Utility

; On-board test envs cover the I2C-path x SoC-generation matrix, not board variants (variant-only
; siblings are the build CI's compile-config axis). Reduced from 19 -> 6 + Port C:
;   Wire x ESP32 = Core2 (its Port A is independent of the internal bus, unlike Core/Fire/Gray)
;   Wire x S3 = CoreS3 / Wire x P4 = Tab5 / Ex_I2C x C6 = NanoC6 / Ex_I2C x H2 = NanoH2 /
;   SoftwareI2C x C6 = NessoN1 / GROVE Port C (classic Core + M5GO/Fire base) = PORTC below
[env:test_MPU6886_Core2]
extends=Core2, option_release, arduino_latest
lib_deps = ${Core2.lib_deps}
  ${test_fw.lib_deps}
test_filter= embedded/test_mpu6886

[env:test_MPU6886_CoreS3]
extends=CoreS3, option_release, arduino_latest
lib_deps = ${CoreS3.lib_deps}
  ${test_fw.lib_deps}
test_filter= embedded/test_mpu6886

[env:test_MPU6886_NanoC6]
extends=NanoC6, option_release, pioarduino_latest
lib_deps = ${NanoC6.lib_deps}
  ${test_fw.lib_deps}
test_filter= embedded/test_mpu6886

[env:test_MPU6886_NanoH2]
extends=NanoH2, option_release, pioarduino_latest
lib_deps = ${NanoH2.lib_deps}
  ${test_fw.lib_deps}
test_filter= embedded/test_mpu6886

[env:test_MPU6886_Tab5]
extends=Tab5, option_release, pioarduino_latest
build_flags = ${Tab5.build_flags}
  ${option_release.build_flags}
lib_deps = ${Tab5.lib_deps}
  ${test_fw.lib_deps}
test_filter= embedded/test_mpu6886

[env:test_MPU6886_NessoN1]
extends=NessoN1, option_release, pioarduino_latest
lib_deps = ${NessoN1.lib_deps}
  ${test_fw.lib_deps}
test_filter= embedded/test_mpu6886

; GROVE Port C path (this library's i2cPortC lgfx-port-1 rebind): classic Core with the M5GO/Fire
; base, external MiniIMU plugged into Port C (coexists with the internal 0x68 on Port A's bus)
[env:test_PORTC_MPU6886_Core]
extends=Core, option_release, arduino_latest
build_flags = ${option_release.build_flags}
  -DTEST_PORT_C
lib_deps = ${Core.lib_deps}
  ${test_fw.lib_deps}
test_filter= embedded/test_mpu6886
[env:-----------------------------------------------separator1]


; ================================
; BMM150 standalone driver (UnitBMM150). No M5 product exposes a BMM150 on the main bus over GROVE,
; so these need a bare BMM150 breakout wired to it. The BMM150s that M5 boards do carry are reached
; elsewhere: Fire/Gray have one on the internal bus (test_BUILTIN_BMM150_*), while CoreS3, AtomS3R
; and the Mini IMU-Pro put theirs behind the BMI270's AUX bridge, where UnitBMM150 cannot address it
; at all -- those are covered by test_bmi270's AuxMagWhenPresent and test_imu_pro.
; ================================
[env:test_BMM150_CoreS3]
extends=CoreS3, option_release, arduino_latest
lib_deps = ${CoreS3.lib_deps}
  ${test_fw.lib_deps}
test_filter= embedded/test_bmm150

[env:test_BMM150_Core2]
extends=Core2, option_release, arduino_latest
lib_deps = ${Core2.lib_deps}
  ${test_fw.lib_deps}
test_filter= embedded/test_bmm150

[env:test_BMM150_NanoC6]
extends=NanoC6, option_release, pioarduino_latest
lib_deps = ${NanoC6.lib_deps}
  ${test_fw.lib_deps}
test_filter= embedded/test_bmm150

[env:test_BMM150_NanoH2]
extends=NanoH2, option_release, pioarduino_latest
lib_deps = ${NanoH2.lib_deps}
  ${test_fw.lib_deps}
test_filter= embedded/test_bmm150

[env:test_BMM150_NessoN1]
extends=NessoN1, option_release, pioarduino_latest
lib_deps = ${NessoN1.lib_deps}
  ${test_fw.lib_deps}
test_filter= embedded/test_bmm150
[env:-----------------------------------------------separator2]


