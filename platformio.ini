; AK8963 is the magnetometer inside the MPU9250 on original (pre-2019.7) M5Stack Fire/Gray;
; requires an MPU9250-generation unit (later revisions have BMM150 instead). Reached at 0x0C
; after the MPU9250 I2C bypass is opened (see m5::unit::imu::enableAuxBypass).
; 2017.12-2019.6 Gray (MPU9250 generation); same-generation Fire is test_BUILTIN_AK8963_Fire
[env:test_BUILTIN_AK8963_Gray]
extends=Gray, option_release, arduino_latest
build_flags = ${option_release.build_flags}
  -DTEST_BUILTIN
lib_deps = ${Gray.lib_deps}
  ${test_fw.lib_deps}
test_filter= embedded/test_ak8963

[env:test_BUILTIN_AK8963_Fire]
extends=Fire, option_release, arduino_latest
build_flags = ${option_release.build_flags}
  -DTEST_BUILTIN
lib_deps = ${Fire.lib_deps}
  ${test_fw.lib_deps}
test_filter= embedded/test_ak8963

; MAG3110 (NXP 3-axis magnetometer) is the mag on the original (2017) M5Stack Gray, paired with an
; MPU6050. It sits directly on the internal bus at 0x0E (WHO_AM_I 0x07 = 0xC4), no aux bypass needed.
[env:test_BUILTIN_MAG3110_Gray]
extends=Gray, option_release, arduino_latest
build_flags = ${option_release.build_flags}
  -DTEST_BUILTIN
lib_deps = ${Gray.lib_deps}
  ${test_fw.lib_deps}
test_filter= embedded/test_mag3110

; MPU6050 is the accel/gyro on the original (2017) M5Stack Gray (paired with a MAG3110 magnetometer,
; not yet supported); later Gray revisions moved to MPU9250 (2017.12) then MPU6886 (2019.6). Requires
; an original-generation Gray (WHO_AM_I 0x68 at 0x68).
[env:test_BUILTIN_MPU6050_Gray]
extends=Gray, option_release, arduino_latest
build_flags = ${option_release.build_flags}
  -DTEST_BUILTIN
lib_deps = ${Gray.lib_deps}
  ${test_fw.lib_deps}
test_filter= embedded/test_mpu6050

; MPU9250 (9-axis: MPU6500-class accel/gyro + internal AK8963 mag) is the built-in IMU on the
; original M5Stack Gray (2017.12-2019.6) and original Fire (<=2019.6). WHO_AM_I 0x71 at 0x68; the
; UnitMPU9250 composite opens the aux bypass so the AK8963 answers at 0x0C.
[env:test_BUILTIN_MPU9250_Gray]
extends=Gray, option_release, arduino_latest
build_flags = ${option_release.build_flags}
  -DTEST_BUILTIN
lib_deps = ${Gray.lib_deps}
  ${test_fw.lib_deps}
test_filter= embedded/test_mpu9250

[env:test_BUILTIN_MPU9250_Fire]
extends=Fire, option_release, arduino_latest
build_flags = ${option_release.build_flags}
  -DTEST_BUILTIN
lib_deps = ${Fire.lib_deps}
  ${test_fw.lib_deps}
test_filter= embedded/test_mpu9250

; MPU6500 has no M5 built-in (it is the accel/gyro die of an MPU9250, covered by test_mpu9250); this
; targets an external standalone MPU6500 breakout on the Grove port (WHO_AM_I 0x70 at 0x68).
[env:test_MPU6500_Core2]
extends=Core2, option_release, arduino_latest
build_flags = ${option_release.build_flags}
lib_deps = ${Core2.lib_deps}
  ${test_fw.lib_deps}
test_filter= embedded/test_mpu6500

