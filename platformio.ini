lib_deps = ${NessoN1.lib_deps}
  ${test_fw.lib_deps}
test_filter= embedded/test_bmi270
[env:-----------------------------------------------separator4]


; ================================
; Unit DoF9/DoF10 composite (GROVE; plug the DoF unit into the Grove port).
; The DoF10's SPA06 barometer driver (UnitSPA06) comes from M5Unit-ENV; its standalone test
; lives there (test_spa06). Here it is covered as the DoF10's baro child.
; Build with -D DOF_BMI270_ADDRESS=0x69 when the board's SW1 is flipped (0x68 default).
; ================================
; Unit DoF6 (U228) is a bare BMI270, which the library exposes as the plain UnitBMI270 (UnitDoF6 is
; an alias for it). test_BMI270_* builds UnitBMI270AuxBMM150 instead and is meant for a U171, so
; these are the envs that exercise the base class the way a DoF6 is actually driven.
[env:test_DOF6_Core2]
extends=Core2, option_release, arduino_latest
lib_deps = ${Core2.lib_deps}
  ${test_fw.lib_deps}
test_filter= embedded/test_dof6

[env:test_DOF6_NessoN1]
extends=NessoN1, option_release, pioarduino_latest
lib_deps = ${NessoN1.lib_deps}
  ${test_fw.lib_deps}
test_filter= embedded/test_dof6

[env:test_DOF9_Core2]
extends=Core2, option_release, arduino_latest
lib_deps = ${Core2.lib_deps}
  ${test_fw.lib_deps}
test_filter= embedded/test_dof9

[env:test_DOF10_Core2]
extends=Core2, option_release, arduino_latest
lib_deps = ${Core2.lib_deps}
  ${test_fw.lib_deps}
test_filter= embedded/test_dof10

; Unit Mini IMU-Pro (U171): BMI270 (0x68 fixed) + BMP280 (0x76, driver from M5Unit-ENV) on the main
; bus, plus a BMM150 on the BMI270's AUX interface (not addressable from the main bus). Also doubles
; as the GROVE hardware for test_BMI270_* (its AUX BMM150 exercises the aux path).
[env:test_IMUPRO_Core2]
extends=Core2, option_release, arduino_latest
lib_deps = ${Core2.lib_deps}
  ${test_fw.lib_deps}
test_filter= embedded/test_imu_pro

; Heaviest composite (3 periodic devices on one shared bus) over the most fragile path (C6
; SoftwareI2C) -- the one chip-x-path interaction the single-chip envs do not reach
[env:test_DOF10_NessoN1]
extends=NessoN1, option_release, pioarduino_latest
lib_deps = ${NessoN1.lib_deps}
  ${test_fw.lib_deps}
test_filter= embedded/test_dof10
[env:-----------------------------------------------separator5]


