description: M5UnitUnified library for IMU series (UnitIMUMini, DoF6/DoF9/DoF10, BMM350, built-in IMUs)
url: https://github.com/m5stack/M5Unit-IMU
issues: https://github.com/m5stack/M5Unit-IMU/issues
license: MIT
version: "0.0.1"

dependencies:
  idf: ">=5.0"
  # M5UnitUnified is not yet on the ESP Component Registry, so reference the main
  # branch via git (switch to a version constraint after publish).
  m5stack/M5UnitUnified:
    git: https://github.com/m5stack/M5UnitUnified.git
    version: main
  # Barometer drivers (UnitSPA06 for DoF10 / UnitBMP280 for MiniIMUPro) live in M5Unit-ENV, shipped
  # in its 1.6.0 release. Reference the master branch via git until M5Unit-ENV is on the ESP
  # Component Registry (then switch to a version constraint).
  m5stack/M5Unit-ENV:
    git: https://github.com/m5stack/M5Unit-ENV.git
    version: master

targets:
  - esp32
  - esp32s3
  - esp32c3
  - esp32c6
  - esp32h2
  - esp32p4

files:
  exclude:
    - "docs/**"
    - "examples/**"
    - "test/**"
    - "boards/**"
    - ".clang-format"
    - "platformio.ini"
    - "library.json"
    - "library.properties"
