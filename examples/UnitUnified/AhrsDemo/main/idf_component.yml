## Dependencies for the ESP-IDF build of the AhrsDemo example.
## - M5Unit-IMU is taken from the local checkout (path) so the example builds against the library
##   in this repo. M5UnitUnified (and its transitive deps M5HAL / M5Utility) are pulled in via
##   M5Unit-IMU's own idf_component.yml (git main until the ESP Component Registry publish).
## - m5gfx: TEMPORARY workaround. M5Unified 0.2.18 lost its m5gfx dependency declaration
##   (commit c1df9de6; confirmed as a bug by the author, fix pending) so registry consumers fail
##   with "Failed to resolve component 'm5gfx'". Remove this entry once a fixed M5Unified release
##   restores the declaration. The KEY MUST BE lower-case "m5gfx": the managed_components directory
##   (and thus the component's short name) follows the manifest key's case, and M5Unified's
##   CMakeLists REQUIRES the lower-case name "m5gfx".
## - esp_wifi_remote / esp_hosted: ESP32-P4 has no on-die radio. On Tab5 the web viewer's WiFi runs on
##   the ESP32-C6 co-processor over SDIO, configured by esp_hosted's Tab5 preset
##   (../sdkconfig.defaults.esp32p4). esp_hosted stays on 2.x, the series the Arduino core uses with
##   Tab5. Below IDF 5.3 neither is fetched and the viewer is compiled out on P4.
dependencies:
  idf: ">=5.0"
  m5stack/M5Unit-IMU:
    path: "../../../.."
  m5stack/M5Unified: ">=0.2.17"
  m5stack/m5gfx: ">=0.2.9"
  espressif/esp_wifi_remote:
    version: ">=0.8"
    rules:
      - if: "target == esp32p4"
      - if: "idf_version >=5.3"
  espressif/esp_hosted:
    version: ">=2.12.13,<3.0"
    rules:
      - if: "target == esp32p4"
      - if: "idf_version >=5.3"
