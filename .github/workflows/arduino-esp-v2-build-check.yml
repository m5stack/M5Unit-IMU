name: Build(arduino-esp32:2.x)

env:
  SKETCH_NAMES_FIND_START: ./examples/UnitUnified
  REQUIRED_LIBRARIES: M5Unified,M5UnitUnified,M5Unit-ENV,M5Unit-HUB

on:
  push:
    tags-ignore:
      - '*.*.*'
      - 'v*.*.*'
    branches:
      - '*'
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '.github/workflows/arduino-esp-v2-build-check.yml'
  pull_request:
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '.github/workflows/arduino-esp-v2-build-check.yml'
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.build-properties }}:${{ matrix.sketch }}:${{matrix.board}}@${{matrix.platform-version}}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        platform-url:
          - https://espressif.github.io/arduino-esp32/package_esp32_index.json

        sketch:
          - PlotToSerial

        build-properties:
          - "-DUSING_UNIT_MINI_IMU"

        board:
          # Reduced to chip-arch reps (esp32 core 2.x supports only ESP32 / S3). This workflow
          # verifies the core-2.x toolchain; unit/ifdef coverage lives in platformio-build-check.yml.
          # Siblings below compile identical code (variant-header only) -> covered by the reps.
          - m5stack-core-esp32   # ESP32 representative
          - m5stack-cores3       # ESP32-S3 representative
#          - m5stack-atom        # ESP32: represented by core-esp32
#          - m5stack-atoms3      # ESP32-S3: represented by cores3
#          - m5stack-core2       # ESP32: represented by core-esp32
#          - m5stack-coreink     # ESP32: represented by core-esp32
#          - m5stack-fire        # ESP32: represented by core-esp32

        platform-version:
          - 2.0.17

        platform:
          - esp32

        archi:
          - esp32

        include:
          # UnitBMM350 (U231, GROVE): single representative board (Core2, shared with v3/m5),
          # full board coverage lives in platformio-build-check.yml.
          - sketch: PlotToSerial
            platform-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            platform: esp32
            archi: esp32
            platform-version: 2.0.17
            board: m5stack-core2
            build-properties: "-DUSING_UNIT_BMM350"
          # UnitDoF10 (composite: BMI270 + BMM350 AUX + SPA06 baro): exercises the M5Unit-ENV
          # umbrella-header LDF activation path (<M5UnitUnifiedENV.h>). Regression guard for the
          # arduino-esp32 core-2.x toolchain; full unit/board coverage lives in platformio-build-check.yml.
          - sketch: PlotToSerial
            platform-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            platform: esp32
            archi: esp32
            platform-version: 2.0.17
            board: m5stack-core2
            build-properties: "-DUSING_UNIT_DOF10"
          # AhrsDemo: own source (WiFi web viewer + LCD gizmo + begin_builtin dispatch). BUILTIN
          # compiles the most AhrsDemo-unique code; verifies it builds on the core-2.x toolchain.
          - sketch: AhrsDemo
            platform-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            platform: esp32
            archi: esp32
            platform-version: 2.0.17
            board: m5stack-cores3
            build-properties: "-DUSING_BUILTIN_IMU"
          # ViaPaHub (UnitMiniIMU / DoF6 / DoF9 / DoF10 / BMM350 on one PaHub; M5Unit-HUB is an
          # example-only dependency). Core only: verifies it builds on the core-2.x toolchain.
          - sketch: ViaPaHub
            platform-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            platform: esp32
            archi: esp32
            platform-version: 2.0.17
            board: m5stack-core-esp32
            build-properties: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare libraries list
        id: libs
        run: |
          {
            echo "yaml<<EOF"
            echo "$REQUIRED_LIBRARIES" | tr ',' '\n' | while read -r lib; do
              echo "- name: $lib"
            done
            echo "- source-path: ./"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compile examples
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.platform }}:${{ matrix.archi }}:${{ matrix.board }}
          platforms: |
            - name: ${{ matrix.platform }}:${{ matrix.archi }}
              source-url: ${{ matrix.platform-url }}
              version: ${{ matrix.platform-version }}
          libraries: ${{ steps.libs.outputs.yaml }}
          sketch-paths: |
            - ${{ env.SKETCH_NAMES_FIND_START }}/${{ matrix.sketch }}
          cli-compile-flags: |
            - --build-property
            - build.extra_flags=${{ matrix.build-properties }}
