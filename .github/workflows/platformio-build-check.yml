name: Build(platformio)

on:
  push:
    tags-ignore:
      - '*.*.*'
      - 'v*.*.*'
    branches:
      - '*'
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '.github/workflows/platformio-build-check.yml'
      - 'platformio.ini'
  pull_request:
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '.github/workflows/platformio-build-check.yml'
      - 'platformio.ini'
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.unit }}:${{ matrix.example }}@${{ matrix.board }}:${{ matrix.framework }}:${{ matrix.espressif32 }}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    strategy:
      fail-fast: false
      max-parallel: 20

      matrix:
        example:
          - PlotToSerial

        unit:
          - UnitMiniIMU

        # Reduced from 19 -> 6 boards. What a board contributes here is a distinct compile config
        # (toolchain x chip arch), not a wiring path: the I2C route is chosen at runtime from
        # M5.getBoard(), so every board below compiles the same library code. The 13 commented-out
        # entries differ only in their variant header (pins_arduino.h), which the library never
        # reads -- a break there is an upstream (M5Unified / platform) matter, not ours.
        # Core2 is still built: the include: entries below pin it explicitly.
        board:
          - Core          # espressif32 x ESP32: xtensa-esp32 GCC target
          - CoreS3        # espressif32 x ESP32-S3: xtensa-esp32s3, a different GCC target
          - NanoC6        # pioarduino x ESP32-C6: rv32, huge_app.csv, repo-local board json
          - NanoH2        # pioarduino x ESP32-H2: separate image target, huge_app.csv
          - Tab5          # pioarduino x ESP32-P4: rv32 single-float FPU, PSRAM, huge_app.csv
          - NessoN1       # pioarduino x ESP32-C6, but an upstream board json (arduino_nesso_n1) and
                          # the only SoftwareI2C host -- one job's worth of insurance
        # ESP32, represented by Core:
#          - Core2
#          - Fire
#          - Atom
#          - StickCPlus
#          - StickCPlus2  # variant differs per package (see libraries/CLAUDE.md), but that only
                          # resolves pins_arduino.h; library code compiles as on Core
#          - Paper
#          - CoreInk
        # ESP32-S3, represented by CoreS3:
#          - StampS3
#          - Dial
#          - AtomS3
#          - AtomS3R
#          - StickS3
#          - Cardputer

        framework:
          - Arduino

        espressif32:
          - latest

        include:
          # PlotToSerial's other units (each a distinct USING_* ifdef branch) on ONE representative
          # board (Core2): the branch only needs to compile once. Board/variant-header and toolchain
          # coverage (espressif32 + pioarduino C6/H2/P4) all come from the full UnitMiniIMU list above.
          - example: PlotToSerial
            unit: UnitBMM350
            board: Core2
            framework: Arduino
            espressif32: latest
          - example: PlotToSerial
            unit: UnitDoF6
            board: Core2
            framework: Arduino
            espressif32: latest
          - example: PlotToSerial
            unit: UnitDoF9
            board: Core2
            framework: Arduino
            espressif32: latest
          - example: PlotToSerial
            unit: UnitDoF10
            board: Core2
            framework: Arduino
            espressif32: latest
          - example: PlotToSerial
            unit: UnitMiniIMUPro
            board: Core2
            framework: Arduino
            espressif32: latest
          # AhrsDemo has its OWN source (AhrsController + LCD gizmo + WiFi web viewer) with eight
          # ifdef branches and SoC-specific WiFi code (H2 no-radio guard, P4 co-processor routing).
          # Build each branch once, spread across SoCs/toolchains so H2 / P4 WiFi and pioarduino are
          # all exercised. The BuiltIn_* / *_BMM350_* envs do not follow the format() pattern, so
          # every entry pins an explicit `env`.
          - example: AhrsDemo  # MINI_IMU, ESP32, normal WiFi
            unit: UnitMiniIMU
            board: Core
            framework: Arduino
            espressif32: latest
            env: UnitMiniIMU_AhrsDemo_Core_Arduino_latest
          - example: AhrsDemo  # MINI_IMU + BMM350, 9-axis GROVE pair
            unit: UnitMiniIMU_BMM350
            board: Core2
            framework: Arduino
            espressif32: latest
            env: UnitMiniIMU_BMM350_AhrsDemo_Core2_Arduino_latest
          - example: AhrsDemo  # DOF6 composite
            unit: UnitDoF6
            board: Core2
            framework: Arduino
            espressif32: latest
            env: UnitDoF6_AhrsDemo_Core2_Arduino_latest
          - example: AhrsDemo  # DOF9 composite
            unit: UnitDoF9
            board: Core2
            framework: Arduino
            espressif32: latest
            env: UnitDoF9_AhrsDemo_Core2_Arduino_latest
          - example: AhrsDemo  # DOF10 composite + baro, C6 pioarduino toolchain
            unit: UnitDoF10
            board: NanoC6
            framework: Arduino
            espressif32: latest
            env: UnitDoF10_AhrsDemo_NanoC6_Arduino_latest
          - example: AhrsDemo  # DOF10, H2 WiFi guard (no on-die radio)
            unit: UnitDoF10
            board: NanoH2
            framework: Arduino
            espressif32: latest
            env: UnitDoF10_AhrsDemo_NanoH2_Arduino_latest
          - example: AhrsDemo  # MINI_IMU_PRO composite + BMP280
            unit: UnitMiniIMUPro
            board: Core2
            framework: Arduino
            espressif32: latest
            env: UnitMiniIMUPro_AhrsDemo_Core2_Arduino_latest
          - example: AhrsDemo  # BUILTIN + GROVE BMM350 (mag-less host goes 9-axis)
            unit: BuiltIn_BMM350
            board: Core2
            framework: Arduino
            espressif32: latest
            env: BuiltIn_BMM350_AhrsDemo_Core2_Arduino_latest
          - example: AhrsDemo  # BUILTIN dispatch (M5.In_I2C), S3
            unit: BuiltIn
            board: CoreS3
            framework: Arduino
            espressif32: latest
            env: BuiltIn_CoreS3_AhrsDemo_Arduino_latest
          - example: AhrsDemo  # BUILTIN + P4 co-processor WiFi (Tab5)
            unit: BuiltIn
            board: Tab5
            framework: Arduino
            espressif32: latest
            env: BuiltIn_Tab5_AhrsDemo_Arduino_latest
          # MotionEvents: own source (MotionEventController + SoftwareFreeFall + LCD sprite). BMI270
          # any_motion feature engine path is chip-specific; PlotToSerial already validates wiring
          # coverage across boards, so MotionEvents CI needs only the Core2 representative.
          - example: MotionEvents
            unit: UnitDoF6
            board: Core2
            framework: Arduino
            espressif32: latest
            env: UnitDoF6_MotionEvents_Core2_Arduino_latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install intelhex
        run: pip install intelhex

      - name: Build examples
        uses: karniv00l/platformio-run-action@v1
        with:
          environments: ${{ matrix.env || format('{0}_{1}_{2}_{3}_{4}', matrix.unit, matrix.example, matrix.board, matrix.framework, matrix.espressif32) }}
#         targets:
          project-dir: "./"
          project-conf: "./platformio.ini"
#          jobs: 6
#          silent: false
#          verbose: true
#          disable-auto-clean: false
