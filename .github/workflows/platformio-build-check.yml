name: Build(platformio)

on:
  push:
    tags-ignore:
      - '*.*.*'
      - 'v*.*.*'
    branches:
      - '*'
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '.github/workflows/platformio-build-check.yml'
      - 'platformio.ini'
  pull_request:
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '.github/workflows/platformio-build-check.yml'
      - 'platformio.ini'
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.unit }}:${{ matrix.example }}@${{ matrix.board }}:${{ matrix.framework }}:${{ matrix.espressif32 }}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    strategy:
      fail-fast: false
      max-parallel: 20

      matrix:
        example:
          - PlotToSerial

        unit:
          - UnitMiniIMU

        board:
          - Core
          - Core2
          - CoreS3
          - Fire
          - StampS3
          - Dial
          - Atom
          - AtomS3
          - AtomS3R
          - NanoC6
          - NanoH2
          - StickCPlus
          - StickCPlus2
          - StickS3
          - Paper
          - CoreInk
          - Cardputer
          - Tab5
          - NessoN1

        framework:
          - Arduino

        espressif32:
          - latest

        include:
          # UnitBMM350 (U231, GROVE): 4 representative boards only, not the full UnitIMU board list
          - example: PlotToSerial
            unit: UnitBMM350
            board: CoreS3
            framework: Arduino
            espressif32: latest
          - example: PlotToSerial
            unit: UnitBMM350
            board: Core2
            framework: Arduino
            espressif32: latest
          - example: PlotToSerial
            unit: UnitBMM350
            board: NanoC6
            framework: Arduino
            espressif32: latest
          - example: PlotToSerial
            unit: UnitBMM350
            board: NessoN1
            framework: Arduino
            espressif32: latest
          # AhrsDemo: own source (AhrsController + LCD gizmo), not the M5.getBoard()-agnostic
          # PlotToSerial.cpp -- Core2 covers the GROVE USING_UNIT_MINI_IMU path, CoreS3 covers the
          # USING_BUILTIN_IMU path (M5.In_I2C built-in BMI270). The built-in env uses the BuiltIn_*
          # naming, so give both entries an explicit `env`.
          - example: AhrsDemo
            unit: UnitMiniIMU
            board: Core2
            framework: Arduino
            espressif32: latest
            env: UnitMiniIMU_AhrsDemo_Core2_Arduino_latest
          - example: AhrsDemo
            unit: BuiltIn
            board: CoreS3
            framework: Arduino
            espressif32: latest
            env: BuiltIn_CoreS3_AhrsDemo_Arduino_latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install intelhex
        run: pip install intelhex

      - name: Build examples
        uses: karniv00l/platformio-run-action@v1
        with:
          environments: ${{ matrix.env || format('{0}_{1}_{2}_{3}_{4}', matrix.unit, matrix.example, matrix.board, matrix.framework, matrix.espressif32) }}
#         targets:
          project-dir: "./"
          project-conf: "./platformio.ini"
#          jobs: 6
#          silent: false
#          verbose: true
#          disable-auto-clean: false
